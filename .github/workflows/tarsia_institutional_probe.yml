name: Tarsia institutional acquisition
on:
  push:
    branches: [fix/tarsia-institutional-vat]
    paths: ['.github/workflows/tarsia_institutional_probe.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tarsia-institutional-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 pypdf==5.9.0
      - name: Download exact attachments observed on the four project-specific official pages
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,hashlib,time,socket,ipaddress,re
          from pathlib import Path
          from urllib.parse import urlsplit,urljoin
          from concurrent.futures import ThreadPoolExecutor
          from pypdf import PdfReader
          root=Path('reports/tarsia-institutional');root.mkdir(parents=True,exist_ok=True)
          # URLs copied from captured official detail pages, not guessed identifiers.
          sources=[
            ('sia-2021','https://www.regione.calabria.it/wp-content/uploads/2021/09/Studio-di-Impatto-Ambientale-Tarsia-Ovest.pdf'),
            ('relazione-2021','https://www.regione.calabria.it/wp-content/uploads/2021/09/Relazione-Tecnica-Descrittiva.pdf'),
            ('planimetria-2021','https://www.regione.calabria.it/wp-content/uploads/2021/09/Planimetria-Generale.pdf'),
            ('paur-3509-2023','https://www.regione.calabria.it/wp-content/uploads/2023/03/360_parco-eolico-tarsia-ovest-ddg-3509-del-13_03_2023.pdf'),
            ('voltura-18794-2025','https://www.regione.calabria.it/wp-content/uploads/2025/12/Atto_Numero_18794_del_09-12-2025377543620060097974.pdf'),
            ('variante-6500-2026','https://www.regione.calabria.it/wp-content/uploads/2026/04/PDF_97155_3746827047354100418.pdf')]
          def validate(url):
            p=urlsplit(url);h=p.hostname or ''
            if p.scheme!='https' or p.username or p.password or p.port not in (None,443) or not(h=='regione.calabria.it' or h.endswith('.regione.calabria.it')):raise ValueError('Unexpected source; manual review required')
            if any(not ipaddress.ip_address(x[4][0]).is_global for x in socket.getaddrinfo(h,443)):raise ValueError('Non-public destination')
          def fetch(item):
            key,url=item;out={'id':key,'url':url,'status':'pending','semantic_analysis':'pending'};start=time.monotonic();path=root/(key+'.pdf');part=path.with_suffix('.part')
            try:
              with requests.Session() as client:
                final=url
                for _ in range(6):
                  validate(final);r=client.get(final,stream=True,timeout=(10,40),allow_redirects=False,headers={'User-Agent':'WindProjectHarvester/1.1','Accept-Encoding':'identity'})
                  if r.status_code not in (301,302,303,307,308):break
                  location=r.headers.get('Location');r.close()
                  if not location:raise ValueError('Redirect without location')
                  final=urljoin(final,location)
                else:raise ValueError('Redirect limit')
                out.update(http_status=r.status_code,final_url=final);r.raise_for_status();sha=hashlib.sha256();count=0
                with part.open('wb') as f:
                  for b in r.iter_content(131072):
                    count+=len(b)
                    if count>256*1024**2 or time.monotonic()-start>240:raise ValueError('Transfer budget reached; incomplete')
                    sha.update(b);f.write(b)
                if not count or (r.headers.get('Content-Length') and int(r.headers['Content-Length'])!=count):raise ValueError('Incomplete body')
                with part.open('rb') as f:
                  if b'%PDF-' not in f.read(1024):raise ValueError('Response is not PDF')
                out.update(bytes=count,sha256=sha.hexdigest(),etag=r.headers.get('ETag'),last_modified=r.headers.get('Last-Modified'));r.close();part.replace(path)
              out.update(status='acquired',file=path.name);pdf=PdfReader(path);pages=[];links=[]
              for n,p in enumerate(pdf.pages,1):
                try:txt=p.extract_text() or '';pages.append({'page':n,'text':txt})
                except Exception as e:pages.append({'page':n,'text':'','extraction_error':str(e)});txt=''
                links.extend(re.findall(r'https?://[^\s<>]+',txt))
                for a in p.get('/Annots') or []:
                  try:
                    action=a.get_object().get('/A') or {};uri=action.get('/URI')
                    if uri:links.append(str(uri))
                  except Exception:pass
              (root/(key+'.text.json')).write_text(json.dumps(pages,ensure_ascii=False),encoding='utf-8')
              out.update(page_count=len(pages),low_text_pages=[p['page'] for p in pages if len(p['text'].strip())<60],embedded_links=sorted(set(links)))
            except Exception as e:out.update(status='error',error=str(e)[:1000])
            out['elapsed_seconds']=round(time.monotonic()-start,3);return out
          results=[]
          with ThreadPoolExecutor(max_workers=2) as pool:
            for out in pool.map(fetch,sources):
              results.append(out);print(json.dumps(out,ensure_ascii=False),flush=True)
              (root/'acquisition.json').write_text(json.dumps({'resources':results,'expected_attachments':6,'full_dossier_complete':False,'paid_model_calls':0},ensure_ascii=False,indent=2),encoding='utf-8')
          if len(results)!=6 or any(r['status']!='acquired' for r in results):raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarsia-institutional-${{ github.run_id }}
          path: reports/tarsia-institutional/
          retention-days: 14
          if-no-files-found: error
