name: Tarsia archive bounded reader
on:
  push:
    branches: ['fix/tarsia-institutional-closeout']
    paths: ['.github/workflows/tarsia_archive_read.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: tarsia-final-archive-reader
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyMuPDF==1.26.4
      - name: Reuse complete archive already acquired, no portal redownload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37523274647 --repo EmAnzi3/project_radar_mvp --name tarsia-full-archive-37523274647 --dir input
      - name: Unwrap CMS, deduplicate payloads, extract and screen all unique PDFs
        run: python -u scripts/tarsia_archive_inventory.py --source input/PAURTarsiaovest.zip --output review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarsia-archive-bounded-${{ github.run_id }}
          path: review/
          retention-days: 14
          if-no-files-found: error
