name: Wind Radar source and company watch

on:
  workflow_dispatch:
  schedule:
    # Daily trigger; runtime state enforces 1/3/7/14/30-day source/company cadences.
    - cron: "40 5 * * *"

permissions:
  contents: read

concurrency:
  group: wind-radar-source-company-watch
  cancel-in-progress: false

jobs:
  source-company-watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 105

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: pip install requests beautifulsoup4 lxml pydantic openpyxl

      - name: Restore persistent wind-agent state
        uses: actions/cache@v4
        with:
          path: data/wind_agent.sqlite
          key: wind-agent-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            wind-agent-state-${{ runner.os }}-

      - name: Show due institutional adapters
        run: |
          mkdir -p reports/wind-agent
          python scripts/run_wind_agents.py due --output reports/wind-agent/institutional-due.json

      - name: Run due institutional adapters
        run: |
          python scripts/run_wind_agents.py run --due --output reports/wind-agent/institutional-run.json

      - name: Show due company watches
        run: |
          python scripts/run_wind_agents.py company-due --output reports/wind-agent/company-due.json

      - name: Run due company watches
        run: |
          python scripts/run_wind_agents.py company-run --due --output reports/wind-agent/company-run.json

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = ["## Wind Radar source + company watch"]

          institutional = Path("reports/wind-agent/institutional-run.json")
          if institutional.exists():
              data = json.loads(institutional.read_text(encoding="utf-8"))
              lines.extend([
                  "### Institutional",
                  f"- Executed adapters: {len(data.get('executed_agents', []))}",
                  f"- Findings: {data.get('findings', 0)}",
                  f"- New or changed: {data.get('new_or_changed', 0)}",
                  f"- Source errors: {len(data.get('errors', {}))}",
              ])
              for source_id, error in data.get("errors", {}).items():
                  lines.append(f"  - `{source_id}`: {str(error)[:500]}")
          else:
              lines.extend(["### Institutional", "- Run report missing."])

          company = Path("reports/wind-agent/company-run.json")
          if company.exists():
              data = json.loads(company.read_text(encoding="utf-8"))
              lines.extend([
                  "### Company network",
                  f"- Companies checked: {len(data.get('executed_companies', []))}",
                  f"- Source snapshots: {data.get('findings', 0)}",
                  f"- New or changed: {data.get('new_or_changed', 0)}",
                  f"- Companies with URL errors: {len(data.get('errors', {}))}",
              ])
              for company_id, errors in data.get("errors", {}).items():
                  text = "; ".join(errors) if isinstance(errors, list) else str(errors)
                  lines.append(f"  - `{company_id}`: {text[:500]}")
          else:
              lines.extend(["### Company network", "- Run report missing."])

          text = "\n".join(lines) + "\n"
          print(text)
          if summary_path:
              Path(summary_path).write_text(text, encoding="utf-8")
          PY

      - name: Upload watch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wind-agent-watch-${{ github.run_id }}
          path: reports/wind-agent/
          if-no-files-found: warn
          retention-days: 30
