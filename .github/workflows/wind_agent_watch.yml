name: Wind Radar source and company watch

on:
  workflow_dispatch:
  schedule:
    # Daily project-discovery scan. Institutional project sources run every day;
    # company watches keep their own cadence.
    - cron: "40 5 * * *"

permissions:
  contents: read

concurrency:
  group: wind-radar-source-company-watch
  cancel-in-progress: false

jobs:
  source-company-watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 105

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: pip install requests beautifulsoup4 lxml pydantic openpyxl

      - name: Restore persistent wind-agent state
        uses: actions/cache@v4
        with:
          path: data/wind_agent.sqlite
          key: wind-agent-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            wind-agent-state-${{ runner.os }}-

      - name: Run daily Wind discovery
        run: |
          mkdir -p reports/wind-agent
          python scripts/update_wind_radar_local.py

      - name: Validate daily discovery output
        shell: bash
        run: |
          python scripts/check_wind_daily_discovery.py
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("reports/wind-agent/daily-discovery-latest.json")
          html = Path("reports/wind-agent/daily-discovery-latest.html")
          csv = Path("reports/wind-agent/daily-discovery-latest.csv")
          assert report.exists(), report
          assert html.exists(), html
          assert csv.exists(), csv
          data = json.loads(report.read_text(encoding="utf-8"))
          assert data.get("canonical_projects") == 51, data.get("canonical_projects")
          print(
              "daily discovery:",
              data.get("new_project_candidates", 0), "new candidates,",
              data.get("known_project_updates", 0), "known updates,",
              data.get("identity_reviews", 0), "identity reviews",
          )
          PY

      - name: Publish daily discovery summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          report = Path("reports/wind-agent/daily-discovery-latest.json")
          status = Path("docs/wind/data/local-run-status.json")
          lines = ["## Wind Radar — daily project discovery"]

          if report.exists():
              data = json.loads(report.read_text(encoding="utf-8"))
              lines.extend([
                  f"- Canonical baseline: **{data.get('canonical_projects', 0)} projects**",
                  f"- New project candidates: **{data.get('new_project_candidates', 0)}**",
                  f"- Known-project updates: **{data.get('known_project_updates', 0)}**",
                  f"- Discovery-candidate updates: **{data.get('discovery_candidate_updates', 0)}**",
                  f"- Identity reviews: **{data.get('identity_reviews', 0)}**",
                  f"- Total new/changed events classified: **{data.get('events', 0)}**",
              ])
              for item in (data.get("new_candidates") or [])[:10]:
                  finding = item.get("finding") or {}
                  payload = finding.get("payload") or {}
                  lines.append(
                      f"  - NEW: {payload.get('project_name') or finding.get('title') or finding.get('external_id')} "
                      f"| {payload.get('power_mw') or 'MW n/d'} | {payload.get('region') or 'area n/d'}"
                  )
          else:
              lines.append("- Daily discovery report missing.")

          if status.exists():
              run = json.loads(status.read_text(encoding="utf-8"))
              lines.append(f"- Institutional source errors: **{run.get('institutional', {}).get('errors', 0)}**")
              lines.append(f"- Company source errors: **{run.get('company', {}).get('errors', 0)}**")

          output = "\n".join(lines) + "\n"
          print(output)
          if summary_path:
              Path(summary_path).write_text(output, encoding="utf-8")
          PY

      - name: Upload watch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wind-daily-discovery-${{ github.run_id }}
          path: reports/wind-agent/
          if-no-files-found: warn
          retention-days: 30
