name: Wind Radar institutional watch

on:
  workflow_dispatch:
  schedule:
    # Runs daily; the runner itself enforces each source's 1/3/7/30-day cadence.
    - cron: "40 5 * * *"

permissions:
  contents: read

concurrency:
  group: wind-radar-institutional-watch
  cancel-in-progress: false

jobs:
  institutional-watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: pip install requests beautifulsoup4 lxml pydantic

      - name: Restore persistent wind-agent state
        uses: actions/cache@v4
        with:
          path: data/wind_agent.sqlite
          key: wind-agent-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            wind-agent-state-${{ runner.os }}-

      - name: Show due institutional adapters
        run: |
          mkdir -p reports/wind-agent
          python scripts/run_wind_agents.py due --output reports/wind-agent/due.json

      - name: Run due institutional adapters
        run: |
          python scripts/run_wind_agents.py run --due --output reports/wind-agent/run.json

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("reports/wind-agent/run.json")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = ["## Wind Radar institutional watch"]
          if not report_path.exists():
              lines.append("Run report missing: the runner did not complete.")
          else:
              data = json.loads(report_path.read_text(encoding="utf-8"))
              lines.extend([
                  f"- Executed adapters: {len(data.get('executed_agents', []))}",
                  f"- Findings: {data.get('findings', 0)}",
                  f"- New or changed: {data.get('new_or_changed', 0)}",
                  f"- Source errors: {len(data.get('errors', {}))}",
              ])
              for source_id, error in data.get("errors", {}).items():
                  lines.append(f"  - `{source_id}`: {error[:500]}")
          text = "\n".join(lines) + "\n"
          print(text)
          if summary_path:
              Path(summary_path).write_text(text, encoding="utf-8")
          PY

      - name: Upload watch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wind-agent-watch-${{ github.run_id }}
          path: reports/wind-agent/
          if-no-files-found: warn
          retention-days: 30
