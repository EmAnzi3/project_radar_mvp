name: Wind document audit pilot
on:
  pull_request:
    paths:
      - 'scripts/wind_document_*.py'
      - 'tests/test_wind_document_*.py'
      - 'config/wind_document_*.json'
      - 'requirements-wind-documents.txt'
      - '.github/workflows/wind_document_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wind-document-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-wind-documents.txt
      - run: python -m unittest discover -s tests -p "test_wind_document_*.py" -v
      - name: Repository preflight (tests above, no publication)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check_before_publish.ps1 -SkipTests
      - name: Verify existing dashboard and runtime unchanged
        run: git diff --exit-code -- docs/wind aggiorna_wind_radar.bat app/wind_agents
  pilot:
    needs: checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-wind-documents.txt
      - uses: actions/cache/restore@v4
        with:
          path: reports/wind-document-audit
          key: wind-documents-d2-${{ github.event.pull_request.number || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wind-documents-d2-${{ github.event.pull_request.number || github.ref_name }}-
      - name: Seed ledger without pretending to read documents
        run: >-
          python scripts/wind_document_audit.py
          --output reports/wind-document-audit --seed-repo .
          --qualification-json config/wind_document_qualification_seed.json
          --manifest config/wind_document_pilot.json
      - name: Full paginated inventory and bounded large-file acquisition
        run: >-
          python scripts/wind_document_inventory.py --output reports/wind-document-audit
          --plan config/wind_document_inventory_pilot.json --page-limit 200 --render-limit 4
      - name: Warm pass reuses original hashes and pending queue
        run: >-
          python scripts/wind_document_inventory.py --output reports/wind-document-audit
          --plan config/wind_document_inventory_pilot.json --skip-inventory --render-limit 0
      - name: Verify inventory completeness and actual large-PDF readability
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/wind-document-audit')
          report = json.loads((root/'report.json').read_text())
          inventory = json.loads((root/'inventory-report.json').read_text())
          assert report['registry_counts'] == {'canonical': 51, 'discovery_current': 34, 'recency_review': 4, 'rejected': 7}
          assert report['qualification_records'] == 57 and report['qualification_unlinked'] == 53
          latest = inventory['inventories'][-1]
          assert latest['status'] == 'complete_index', latest
          assert latest['unique_documents'] == latest['expected_documents']
          big = next(d for d in report['documents'] if d['url'].endswith('/File/Documento/1181568'))
          assert any(v['byte_count'] > 30*1024**2 and v['extraction'].get('page_count', 0) > 0 for v in big['versions']), 'Large PDF not acquired/read: inspect attempts'
          assert any(r['path'] for r in inventory['visual_queue']), 'No actual page render'
          assert inventory['complete_dossiers'] == 0
          assert all(d['fascicolo_complete'] is False for d in report['documents'])
          summary = {'index': latest, 'large_pdf_pages': big['current_extraction'].get('page_count'), 'large_pdf_sha256': big['current_sha256'], 'rendered_pages': sum(bool(r['path']) for r in inventory['visual_queue']), 'visual_queue': len(inventory['visual_queue']), 'complete_dossiers': 0}
          (root/'D2-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Import interpreted reviews against exact original versions and pages
        run: >-
          python scripts/wind_document_review.py --output reports/wind-document-audit
          --reviews config/wind_document_review_pilot.json
      - name: Verify review idempotence and evidence integrity without promoting projects
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from wind_document_review import Reviews
          store = Reviews('reports/wind-document-audit')
          try:
              batch = json.loads(Path('config/wind_document_review_pilot.json').read_text(encoding='utf-8'))
              assert store.import_batch(batch) == 0, 'Second import must not duplicate reviews'
              report = store.export()
              assert report['review_count'] == 24 and report['projects_with_review'] == 4
              assert all(r['evidence_integrity'] == 'pinned_evidence_available' for r in report['reviews'])
              assert report['complete_dossiers'] == 0 and report['canonical_writes'] == 0
              assert not any(r['commercial_currentness_certified'] for r in report['reviews'])
              print('D3: 24 page-backed interpretations, 4 projects/records, zero duplicate reviews, zero complete dossiers')
          finally:
              store.close()
          PY
      - name: Verify no canonical writes
        if: always()
        run: git diff --exit-code -- docs/wind aggiorna_wind_radar.bat app/wind_agents
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: reports/wind-document-audit
          key: wind-documents-d2-${{ github.event.pull_request.number || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Include reproducible source and review provenance in the evidence artifact
        if: always()
        run: |
          mkdir -p reports/wind-document-audit/reproduction
          cp scripts/wind_document_*.py tests/test_wind_document_*.py config/wind_document_review_pilot.json reports/wind-document-audit/reproduction/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wind-document-audit-${{ github.run_id }}
          path: reports/wind-document-audit/
          retention-days: 14
          if-no-files-found: error
