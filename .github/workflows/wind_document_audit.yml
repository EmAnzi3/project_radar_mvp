name: Wind document audit pilot
on:
  pull_request:
    paths:
      - 'scripts/wind_document_*.py'
      - 'tests/test_wind_document_*.py'
      - 'config/wind_document_*.json'
      - 'requirements-wind-documents.txt'
      - '.github/workflows/wind_document_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wind-document-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-wind-documents.txt
      - run: python -m unittest discover -s tests -p "test_wind_document_*.py" -v
      - name: Repository preflight (no publication)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check_before_publish.ps1 -SkipTests
      - name: Verify existing dashboard and runtime unchanged
        run: git diff --exit-code -- docs/wind aggiorna_wind_radar.bat app/wind_agents
  pilot:
    needs: checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-wind-documents.txt
      - uses: actions/cache/restore@v4
        with:
          path: reports/wind-document-memory
          key: wind-documents-memory-d5-${{ github.event.pull_request.number || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wind-documents-memory-d5-${{ github.event.pull_request.number || github.ref_name }}-
      - name: One-time migration from the existing D4 working cache
        if: hashFiles('reports/wind-document-memory/audit.sqlite') == ''
        uses: actions/cache/restore@v4
        with:
          path: reports/wind-document-audit
          key: wind-documents-d2-migration-${{ github.run_id }}
          restore-keys: |
            wind-documents-d2-${{ github.event.pull_request.number || github.ref_name }}-
      - name: Read once, persist evidence, release completed sources, check only due changes
        run: |
          python scripts/wind_document_lifecycle.py \
            --output reports/wind-document-audit --memory reports/wind-document-memory \
            | tee "$RUNNER_TEMP/wind-document-cold-run.json"
      - name: Prove a fresh offline restart does not reread completed sources
        run: >-
          python scripts/wind_document_lifecycle.py
          --output reports/wind-document-warm --memory reports/wind-document-memory --no-remote
      - name: Verify versioned manifests, lightweight memory and unchanged project perimeter
        run: |
          python - <<'PY'
          import json, sqlite3, sys, os
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from wind_document_lifecycle import REVIEW_FILES, COMPLETION_FILES, _load
          root = Path('reports/wind-document-memory')
          report = json.loads((root / 'D5-summary.json').read_text(encoding='utf-8'))
          entries = _load(Path('.'), REVIEW_FILES, 'reviews')
          plans = _load(Path('.'), COMPLETION_FILES, 'documents')
          expected_ids = {r['id'] for r in entries}
          expected_versions = {(p['doc_id'], p['sha256']) for p in plans}
          assert len(expected_ids) == len(entries), 'Duplicate review manifests'
          assert len(expected_versions) == len(plans), 'Duplicate completion manifests'
          assert report['registry_counts'] == {'canonical':51,'discovery_current':34,'recency_review':4,'rejected':7}
          assert report['qualification_records'] == 57
          assert report['review_count'] == len(entries)
          assert report['completed_document_versions'] == len(plans)
          assert report['source_reads'] == [], 'Warm restart redownloaded a reviewed source'
          assert report['binary_files_exported'] == 0
          assert not any(p.suffix.lower() in {'.pdf','.png','.bin','.p7m','.zip'} for p in root.rglob('*') if p.is_file())
          assert report['complete_dossiers'] == 0 and report['canonical_writes'] == 0
          with sqlite3.connect(root / 'audit.sqlite') as db:
              assert {r[0] for r in db.execute('SELECT review_id FROM documentary_reviews')} == expected_ids
              assert {tuple(r) for r in db.execute('SELECT doc_id,sha256 FROM document_read_memory')} == expected_versions
              saved = [json.loads(r[0]) for r in db.execute('SELECT completion_json FROM document_read_memory')]
              assert sum(len(p['pages']) for p in saved) == sum(len(p['pages']) for p in plans)
              current = db.execute('SELECT COUNT(*) FROM document_read_memory m JOIN document_heads h ON h.doc_id=m.doc_id AND h.sha256=m.sha256').fetchone()[0]
              assert current == len(plans), 'A reviewed source changed: do not certify its new version as complete'
              for r in db.execute('SELECT extraction_json FROM versions'):
                  assert all('text' not in p for p in json.loads(r[0]).get('pages', [])), 'Full page text leaked into durable memory'
          message = f"D7: {len(entries)} recorded findings, {len(plans)} completed versions / {sum(len(p['pages']) for p in plans)} pages; offline restart with zero source reads."
          print(message)
          cold = json.loads((Path(os.environ['RUNNER_TEMP']) / 'wind-document-cold-run.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(message + '\n\n')
              out.write('First pass source reads: ' + str(len(cold['source_reads'])) + '\n\n')
              for row in cold['currentness_checks']:
                  out.write('Remote check: ' + row['status'] + '; bytes ' + str(row['bytes_transferred']) + '; extractions ' + str(row['text_extractions']) + '\n\n')
              out.write('Queue: ' + json.dumps(report['queue_counts'], sort_keys=True) + '\n')
          PY
      - name: Verify no canonical writes
        if: always()
        run: git diff --exit-code -- docs/wind aggiorna_wind_radar.bat app/wind_agents
      - uses: actions/cache/save@v4
        with:
          path: reports/wind-document-memory
          key: wind-documents-memory-d5-${{ github.event.pull_request.number || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wind-document-memory-${{ github.run_id }}
          path: reports/wind-document-memory/
          retention-days: 14
          if-no-files-found: warn
      - name: Remove transient reading workspaces (never cached or uploaded)
        if: always()
        run: rm -rf reports/wind-document-audit reports/wind-document-warm
