name: Wind Radar preview bundle

on:
  push:
    branches:
      - feat/wind-radar-v0.6-execution-intelligence
    paths:
      - '.github/workflows/wind_preview_bundle.yml'
  workflow_dispatch:

jobs:
  build-preview-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Build offline preview bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview
          cp -a docs/wind preview/wind
          curl -fsSL --retry 3 'https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js' -o preview/wind/assets/echarts.min.js
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_provinces.geojson' -o preview/wind/data/limits_IT_provinces.geojson
          python - <<'PY'
          from pathlib import Path
          index = Path('preview/wind/index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js', 'assets/echarts.min.js')
          index.write_text(html, encoding='utf-8')

          js = Path('preview/wind/assets/province-map-v06.js')
          text = js.read_text(encoding='utf-8')
          old = "const GEO_URLS=[\n  'https://cdn.jsdelivr.net/gh/openpolis/geojson-italy@master/geojson/limits_IT_provinces.geojson',\n  'https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_provinces.geojson'\n];"
          new = "const GEO_URLS=[\n  'data/limits_IT_provinces.geojson'\n];"
          if old not in text:
              raise SystemExit('GEO_URLS block not found')
          js.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: wind-preview-${{ github.run_id }}
          path: preview/wind
          retention-days: 1
