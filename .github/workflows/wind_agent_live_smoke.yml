name: Wind Radar live source smoke

on:
  pull_request:
    paths:
      - 'app/wind_agents/**'
      - 'app/collectors/mase_via.py'
      - 'app/models.py'
      - 'docs/wind/data/institutional-source-network-v06*.json'
      - 'scripts/run_wind_agents.py'
      - '.github/workflows/wind_agent_live_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wind-radar-live-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  institutional-live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: priority-regional
            sources: 'abruzzo-via liguria-via-procedimenti marche-via-regional molise-au-eolico'
          - group: national-market
            sources: 'mase-via mase-provvedimenti terna-econnextion'
          - group: south-islands
            sources: 'basilicata-au-paur basilicata-via calabria-regional-acts calabria-via campania-viavas puglia-au-paur puglia-sistema-energia sardegna-sira sicilia-sivvi'
          - group: centre-north
            sources: 'emilia-romagna-regional lazio-regional lombardia-regional piemonte-regional toscana-atos toscana-gea umbria-regional veneto-regional'

    env:
      WIND_SMOKE_GROUP: ${{ matrix.group }}
      WIND_SMOKE_SOURCES: ${{ matrix.sources }}

    steps:
      - name: Checkout Wind agent runtime
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            app/**
            docs/wind/data/**
            scripts/run_wind_agents.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: pip install requests beautifulsoup4 lxml pydantic openpyxl

      - name: Run adapter group live
        shell: bash
        run: |
          mkdir -p reports/wind-agent-live
          args=()
          for source in $WIND_SMOKE_SOURCES; do
            args+=(--source "$source")
          done
          python scripts/run_wind_agents.py run \
            "${args[@]}" \
            --output "reports/wind-agent-live/${WIND_SMOKE_GROUP}.json"

      - name: Export live findings for review
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path

          group = os.environ['WIND_SMOKE_GROUP']
          report_path = Path(f'reports/wind-agent-live/{group}.json')
          db_path = Path('data/wind_agent.sqlite')
          if not report_path.exists() or not db_path.exists():
              print('No live findings database/report available to export.')
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding='utf-8'))
          run_id = report.get('run_id')
          if not run_id:
              print('Live report has no run_id; skipping findings export.')
              raise SystemExit(0)

          with sqlite3.connect(db_path) as conn:
              conn.row_factory = sqlite3.Row
              rows = conn.execute(
                  '''
                  SELECT agent_name, source_name, external_id, source_url, title,
                         finding_type, payload_json, first_seen, last_seen
                  FROM raw_findings
                  WHERE last_run_id = ?
                  ORDER BY agent_name, source_name, external_id
                  ''',
                  (run_id,),
              ).fetchall()

          findings = []
          for row in rows:
              payload = json.loads(row['payload_json'])
              findings.append({
                  'agent_name': row['agent_name'],
                  'source_name': row['source_name'],
                  'external_id': row['external_id'],
                  'source_url': row['source_url'],
                  'title': row['title'],
                  'finding_type': row['finding_type'],
                  'payload': payload.get('payload') or {},
                  'first_seen': row['first_seen'],
                  'last_seen': row['last_seen'],
              })

          out = {
              'group': group,
              'run_id': run_id,
              'finding_count': len(findings),
              'guard': 'Raw live findings for review only; no canonical promotion or scope closure is implied.',
              'findings': findings,
          }
          output = Path(f'reports/wind-agent-live/{group}-findings.json')
          output.write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Exported {len(findings)} raw findings to {output}')
          PY

      - name: Classify live findings against canonical 51
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from app.wind_agents.reconcile import build_daily_discovery_report

          group = os.environ['WIND_SMOKE_GROUP']
          run_report = Path(f'reports/wind-agent-live/{group}.json')
          if not run_report.exists():
              print('No run report; skip daily classification.')
              raise SystemExit(0)
          run_id = json.loads(run_report.read_text(encoding='utf-8')).get('run_id')
          if not run_id:
              print('No run id; skip daily classification.')
              raise SystemExit(0)

          discovery = build_daily_discovery_report([str(run_id)])
          output = Path(f'reports/wind-agent-live/{group}-daily-discovery.json')
          output.write_text(json.dumps(discovery, ensure_ascii=False, indent=2), encoding='utf-8')
          assert discovery.get('canonical_projects') == 51, discovery.get('canonical_projects')
          print(
              f"{group}: new={discovery.get('new_project_candidates', 0)} "
              f"known={discovery.get('known_project_updates', 0)} "
              f"discovery={discovery.get('discovery_candidate_updates', 0)} "
              f"review={discovery.get('identity_reviews', 0)} "
              f"incomplete={discovery.get('incomplete_project_records', 0)} "
              f"filtered={discovery.get('filtered_non_pipeline', 0)}"
          )
          PY

      - name: Validate live result
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          group = os.environ['WIND_SMOKE_GROUP']
          expected = set(os.environ['WIND_SMOKE_SOURCES'].split())
          path = Path(f'reports/wind-agent-live/{group}.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          executed = set(data.get('executed_agents') or [])
          assert executed == expected, (group, executed, expected)
          assert data.get('bootstrap_new_sources') is True, data.get('bootstrap_new_sources')

          per_agent = data.get('per_agent') or {}
          failures = {
              source_id: row.get('error') or row.get('status')
              for source_id, row in per_agent.items()
              if row.get('status') != 'success'
          }
          if failures or data.get('errors'):
              raise SystemExit(f'{group} live source failures: {failures or data.get("errors")}')

          print(f'{group} live source baseline smoke OK')
          for source_id in sorted(expected):
              row = per_agent[source_id]
              assert row.get('bootstrap_source') is True, (source_id, row)
              assert row.get('new', 0) == 0, (source_id, row)
              assert row.get('changed', 0) == 0, (source_id, row)
              assert row.get('baseline', 0) == row.get('findings', 0), (source_id, row)
              print(
                  f"{source_id}: health={row.get('data_health', 'legacy')} "
                  f"findings={row.get('findings', 0)} project_specific={row.get('project_specific_findings', 0)} "
                  f"baseline={row.get('baseline', 0)} new={row.get('new', 0)} "
                  f"changed={row.get('changed', 0)} duration={row.get('duration_seconds', 0)}s"
              )
          PY

      - name: Run second pass against same SQLite
        shell: bash
        run: |
          args=()
          for source in $WIND_SMOKE_SOURCES; do
            args+=(--source "$source")
          done
          python scripts/run_wind_agents.py run \
            "${args[@]}" \
            --output "reports/wind-agent-live/${WIND_SMOKE_GROUP}-second.json"

      - name: Validate stable second pass
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          group = os.environ['WIND_SMOKE_GROUP']
          expected = set(os.environ['WIND_SMOKE_SOURCES'].split())
          path = Path(f'reports/wind-agent-live/{group}-second.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          assert data.get('bootstrap_new_sources') is True, data.get('bootstrap_new_sources')
          assert not data.get('errors'), data.get('errors')
          assert set(data.get('executed_agents') or []) == expected

          per_agent = data.get('per_agent') or {}
          for source_id in sorted(expected):
              row = per_agent[source_id]
              assert row.get('status') == 'success', (source_id, row)
              assert row.get('new', 0) == 0, (source_id, row)
              assert row.get('changed', 0) == 0, (source_id, row)

              health = row.get('data_health')
              if health == 'project_data':
                  assert row.get('bootstrap_source') is False, (source_id, row)
                  assert row.get('baseline', 0) == 0, (source_id, row)
                  assert row.get('unchanged', 0) == row.get('findings', 0), (source_id, row)

              print(
                  f"{source_id}: health={health} findings={row.get('findings', 0)} "
                  f"baseline={row.get('baseline', 0)} new={row.get('new', 0)} "
                  f"changed={row.get('changed', 0)} unchanged={row.get('unchanged', 0)} "
                  f"duration={row.get('duration_seconds', 0)}s"
              )

          print(f'{group}: stable second pass OK — 0 new / 0 changed')
          PY

      - name: Publish live smoke summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          group = os.environ['WIND_SMOKE_GROUP']
          report = Path(f'reports/wind-agent-live/{group}.json')
          findings_report = Path(f'reports/wind-agent-live/{group}-findings.json')
          discovery_report = Path(f'reports/wind-agent-live/{group}-daily-discovery.json')
          lines = [f'## Wind Radar live smoke — {group}']
          if report.exists():
              data = json.loads(report.read_text(encoding='utf-8'))
              health = data.get('data_health') or {}
              if health:
                  lines.append('- Data health: ' + ', '.join(f'`{k}` {v}' for k, v in sorted(health.items())))
              for source_id, row in sorted((data.get('per_agent') or {}).items()):
                  lines.append(
                      f"- `{source_id}` — {row.get('status')}; health `{row.get('data_health', 'legacy')}`; "
                      f"findings {row.get('findings', 0)}; project-specific {row.get('project_specific_findings', 0)}; "
                      f"baseline {row.get('baseline', 0)}; new {row.get('new', 0)}; "
                      f"changed {row.get('changed', 0)}; duration {row.get('duration_seconds', 0)}s"
                  )
              if findings_report.exists():
                  raw = json.loads(findings_report.read_text(encoding='utf-8'))
                  lines.append(f"- Raw findings exported for review: {raw.get('finding_count', 0)}")
              if discovery_report.exists():
                  disc = json.loads(discovery_report.read_text(encoding='utf-8'))
                  lines.append(
                      f"- Daily classification: **{disc.get('new_project_candidates', 0)} new candidates**, "
                      f"{disc.get('baseline_project_candidates', 0)} baseline backlog candidates, "
                      f"{disc.get('baseline_known_projects', 0)} baseline known, "
                      f"{disc.get('baseline_discovery_candidates', 0)} baseline Discovery, "
                      f"{disc.get('known_project_updates', 0)} known updates, "
                      f"{disc.get('discovery_candidate_updates', 0)} Discovery updates, "
                      f"{disc.get('identity_reviews', 0)} identity reviews, "
                      f"{disc.get('incomplete_project_records', 0)} incomplete, "
                      f"{disc.get('filtered_non_pipeline', 0)} historical/non-target filtered"
                  )
              if data.get('errors'):
                  lines.append(f"- Errors: {data['errors']}")
          else:
              lines.append('- Live report missing.')
          text = '\n'.join(lines) + '\n'
          print(text)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              Path(summary).write_text(text, encoding='utf-8')
          PY

      - name: Upload live smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wind-live-${{ matrix.group }}-${{ github.run_id }}
          path: reports/wind-agent-live/
          if-no-files-found: warn
          retention-days: 14


  daily-state-two-pass-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Wind agent runtime
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            app/**
            docs/wind/data/**
            scripts/run_wind_agents.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: pip install requests beautifulsoup4 lxml pydantic openpyxl

      - name: Run first pass as source baseline
        run: |
          mkdir -p reports/wind-agent-live
          rm -f data/wind_agent.sqlite
          python scripts/run_wind_agents.py run \
            --source puglia-sistema-energia \
            --output reports/wind-agent-live/two-pass-first.json

      - name: Run second pass against same SQLite
        run: |
          python scripts/run_wind_agents.py run \
            --source puglia-sistema-energia \
            --output reports/wind-agent-live/two-pass-second.json

      - name: Validate daily two-pass semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          first = json.loads(Path('reports/wind-agent-live/two-pass-first.json').read_text(encoding='utf-8'))
          second = json.loads(Path('reports/wind-agent-live/two-pass-second.json').read_text(encoding='utf-8'))
          a = first['per_agent']['puglia-sistema-energia']
          b = second['per_agent']['puglia-sistema-energia']

          assert a['status'] == 'success', a
          assert a['findings'] > 0, a
          assert a['bootstrap_source'] is True, a
          assert a['baseline'] == a['findings'], a
          assert a['new'] == 0 and a['changed'] == 0, a

          assert b['status'] == 'success', b
          assert b['findings'] > 0, b
          assert b['bootstrap_source'] is False, b
          assert b['baseline'] == 0, b
          assert b['new'] == 0 and b['changed'] == 0, b
          assert b['unchanged'] == b['findings'], b

          print(
              'Two-pass daily semantics OK: '
              f"first={a['findings']} baseline; "
              f"second={b['unchanged']} unchanged, 0 new, 0 changed"
          )
          PY

      - name: Upload two-pass smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wind-live-two-pass-${{ github.run_id }}
          path: reports/wind-agent-live/two-pass-*.json
          if-no-files-found: warn
          retention-days: 14
