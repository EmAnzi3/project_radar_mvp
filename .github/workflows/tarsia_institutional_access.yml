name: Tarsia institutional access
on:
  push:
    branches: ['fix/tarsia-institutional-closeout']
    paths: ['.github/workflows/tarsia_institutional_access.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tarsia-institutional-access
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            config
            scripts
            tests
            docs/wind
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 beautifulsoup4==4.13.4 pypdf==5.9.0
      - name: Reuse bytes already acquired; do not redownload recovered pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37521032930 --repo EmAnzi3/project_radar_mvp --name tarsia-institutional-37521032930 --dir reports/prior
      - name: Collect exact project pages and observed attachments
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, ipaddress, json, re, socket, time, zipfile
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, urldefrag
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          root=Path('reports/tarsia-institutional');root.mkdir(parents=True,exist_ok=True)
          prior=Path('reports/prior');old=json.loads((prior/'access-manifest.json').read_text())
          previous={r['url']:r for r in old['resources']}
          hosts=('regione.calabria.it','calabriasuap.it','calabriasue.it','plc-spa.it','idokacostruzioni.com','regione.sicilia.it','gruppomammana.it','gleif.org')
          seeds=[
            ('index','https://www.regione.calabria.it/?s=Tarsia+Ovest'),
            ('project','https://www.regione.calabria.it/bandi/progetto-parco-eolico-tarsia-ovest/'),
            ('project','https://www.regione.calabria.it/provvedimenti-regionali/provvedimento-autorizzatorio-unico-regionale-ai-sensi-dellart-27-bis-d-lgs-152-2006-e-smi-parco-eolico-tarsia-ovest-nel-comune-di-tarsia-cs-per-la-realizzazio/'),
            ('project','https://www.regione.calabria.it/provvedimenti-regionali/voltura-del-ddg-n-3509-del-13-03-2023-in-favore-della-eni-plenitude-renewables-italy-spa-avente-ad-oggetto-il-provvedimento-autorizzatorio-unico-regionale-rilasciato-alla-societa-plt-engineering-srl/'),
            ('project','https://www.regione.calabria.it/provvedimenti-regionali/valutazione-preliminare-ambientale-vpa-ai-sensi-dellart-6-comma-9-del-d-lgs-152-2006-e-ss-mm-ii-variante-al-progetto-di-costruzione-ed-esercizio-del-parco-eolico-denominato-t/'),
            ('identity','https://www.plc-spa.it/wp-content/uploads/2025/07/SOA_59847_17_00.pdf'),
            ('identity','https://api.gleif.org/api/v1/lei-records/81560065222D2EEE2575'),
            ('identity','https://gruppomammana.it/contatti/'),
            ('portal','https://calabriasuap.it/'),
            ('contact','https://www.plc-spa.it/plc-system/'),
            ('contact','https://www.idokacostruzioni.com/contatti'),
            ('identity','https://www.regione.sicilia.it/istituzioni/servizi-informativi/decreti-e-direttive/aiu-favore-eni-plenitude-renewables-italy-spa-sede-milano-ripamonti-85-p-iva-09722790962')
          ]
          def stamp():return datetime.now(timezone.utc).isoformat()
          def allowed(url):
            p=urlsplit(url);h=(p.hostname or '').lower()
            return p.scheme in ('https','http') and not p.username and not p.password and p.port in (None,80,443) and any(h==v or h.endswith('.'+v) for v in hosts)
          def acquire(item):
            row=dict(item,checked_at=stamp());u=item['url'];start=time.monotonic();response=None
            try:
              prev=previous.get(u,{})
              if prev.get('file') and (prior/prev['file']).is_file():
                data=(prior/prev['file']).read_bytes()
                if hashlib.sha256(data).hexdigest()!=prev['sha256']:raise ValueError('Recovered original hash mismatch')
                row.update(http_status=prev['http_status'],final_url=prev.get('final_url',u),network_requests=0,recovered_original=True)
              else:
                with requests.Session() as session:
                  for _ in range(5):
                    if not allowed(u):raise ValueError('Outside selected sources: '+u)
                    port=443 if urlsplit(u).scheme=='https' else 80
                    addresses=socket.getaddrinfo(urlsplit(u).hostname,port)
                    if not addresses or any(not ipaddress.ip_address(x[4][0]).is_global for x in addresses):raise ValueError('Non-public address')
                    response=session.get(u,timeout=(7,22),stream=True,allow_redirects=False,headers={'User-Agent':'WindRadarSourceAudit/1.1','Accept-Encoding':'identity'})
                    row.update(http_status=response.status_code,final_url=u,network_requests=row.get('network_requests',0)+1)
                    if response.status_code not in (301,302,303,307,308):break
                    loc=response.headers.get('Location');response.close()
                    if not loc:raise ValueError('Missing redirect')
                    u=urljoin(u,loc)
                  else:raise ValueError('Redirect limit')
                  response.raise_for_status();data=bytearray()
                  for block in response.iter_content(131072):
                    data.extend(block)
                    if len(data)>128*1024**2 or time.monotonic()-start>100:raise ValueError('Transfer budget; pending')
                  if not data:raise ValueError('Empty response')
                  if response.headers.get('Content-Encoding','identity') in ('','identity') and response.headers.get('Content-Length') and int(response.headers['Content-Length'])!=len(data):raise ValueError('Incomplete transfer')
                  data=bytes(data)
              sha=hashlib.sha256(data).hexdigest()
              kind='pdf' if b'%PDF-' in data[:1024] else 'json' if data.lstrip().startswith((b'{',b'[')) else 'html' if b'<html' in data[:4000].lower() or b'<!doctype' in data[:4000].lower() else 'binary'
              dest=root/(sha+'.'+kind);dest.write_bytes(data)
              row.update(status='acquired',sha256=sha,bytes=len(data),file=dest.name,kind=kind,discovered=[],analysis_status='not_analyzed')
              if kind=='pdf':
                reader=PdfReader(dest,strict=False)
                if reader.is_encrypted and not reader.decrypt(''):raise ValueError('Encrypted PDF')
                pages=[]
                for n,page in enumerate(reader.pages,1):
                  try:text=page.extract_text() or '';error=None
                  except Exception as exc:text='';error=str(exc)
                  pages.append({'page':n,'text':text,'error':error})
                (root/(sha+'.pages.json')).write_text(json.dumps(pages,ensure_ascii=False,indent=2),encoding='utf-8');row.update(pages=len(pages),text_file=sha+'.pages.json');return row
              if kind!='html':return row
              soup=BeautifulSoup(data,'html.parser')
              for tag in soup(['script','style','noscript']):tag.decompose()
              text=soup.get_text('\n',strip=True);(root/(sha+'.txt')).write_text(text,encoding='utf-8')
              row.update(text_file=sha+'.txt',title=soup.title.get_text(' ',strip=True) if soup.title else '',links=[],forms=[{'action':f.get('action'),'method':f.get('method'),'inputs':[x.get('name') for x in f.find_all(['input','select'])]} for f in soup.find_all('form')])
              if re.search(r'access denied|verify you are human|request rejected|just a moment',text[:1800],re.I):row['status']='access_challenge';return row
              heading=' '.join(h.get_text(' ',strip=True) for h in soup.find_all('h1'))
              project_page='tarsia' in heading.lower()
              content=soup.find('main') or soup
              for a in content.find_all('a',href=True):
                href=urldefrag(urljoin(u,a['href']))[0];label=a.get_text(' ',strip=True)
                row['links'].append({'url':href,'label':label,'allowed':allowed(href)})
                if not allowed(href):continue
                parent=a.find_parent(['tr','article']);context=parent.get_text(' ',strip=True) if parent else label
                relevant=bool(re.search(r'tarsia',href+' '+label+' '+context,re.I));asset=bool(re.search(r'\.pdf|\.p7m|\.zip|download|allegat|File/Documento|wp-content/uploads',href+' '+label,re.I))
                scope=None
                if item['scope'] in ('index','project') and (relevant or (project_page and asset)):scope='project'
                if item['scope']=='project' and re.search(r'documentazione|elaborati|consultazion|sportello.ambiente|calabriasuap|portale.*ambient',href+' '+label,re.I):scope='portal'
                if item['scope']=='portal' and re.search(r'pubblicazion|consultazion|sportello.ambiente|banca.dati',href+' '+label,re.I):scope='portal'
                if scope:row['discovered'].append({'url':href,'scope':scope,'from':u,'label':label})
              return row
            except Exception as exc:row.update(status='access_or_parse_failed',error=str(exc)[:700]);return row
            finally:
              if response is not None:response.close()
          queue=[{'url':u,'scope':s,'from':'selected_channel_or_observed_link'} for s,u in seeds];seen=set();rows=[];pending=[]
          with ThreadPoolExecutor(max_workers=2) as pool:
            for depth in range(6):
              batch=[]
              for item in queue:
                if item['url'] not in seen:seen.add(item['url']);batch.append(item)
              queue=[]
              if len(rows)+len(batch)>100:pending.extend(batch);break
              for row in pool.map(acquire,batch):
                rows.append(row);print(json.dumps({k:row.get(k) for k in ('url','status','http_status','bytes','pages','error')},ensure_ascii=False),flush=True)
                queue.extend(row.get('discovered',[]))
                (root/'access-manifest.json').write_text(json.dumps({'checked_at':stamp(),'resources':rows,'pending_discovery':queue,'all_documentation_complete':False,'paid_model_calls':0},ensure_ascii=False,indent=2),encoding='utf-8')
              if not queue:break
            pending.extend(x for x in queue if x['url'] not in seen)
          report={'checked_at':stamp(),'resources':rows,'pending_discovery':pending,'all_documentation_complete':False,'paid_model_calls':0,'previous_attempt':old,'guard':'Acquisition and text extraction are not semantic analysis or a complete inventory.'}
          (root/'access-manifest.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'resources':len(rows),'acquired':sum(x['status']=='acquired' for x in rows),'failed':sum(x['status']!='acquired' for x in rows),'pending':len(pending)}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarsia-institutional-${{ github.run_id }}
          path: reports/tarsia-institutional/
          retention-days: 14
          if-no-files-found: error
